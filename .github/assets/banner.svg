<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">Developer Marketing Jobs</title>
  <desc id="d">Every open DevRel, technical writing, developer marketing, product marketing, growth and community role at devtool companies, updated daily.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="1" stop-color="#0a1040"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#cdd6ff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-1;0;-1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="110"/></filter>
    <clipPath id="clip"><rect width="1920" height="1080" rx="36"/></clipPath>
    <style>
      .title { font: 600 112px Georgia, 'Times New Roman', serif; letter-spacing: -1px; }
      .sub { font: 400 52px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #b9c2ff; letter-spacing: 0.8px; }
      .role { font: 600 40px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 2.4px; }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1920" height="1080" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle cx="300" cy="960" r="360" fill="#7c5cff" opacity="0.75">
        <animate attributeName="cx" values="300;700;300" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="960;760;960" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1680" cy="120" r="400" fill="#1f3bff" opacity="0.8">
        <animate attributeName="cx" values="1680;1300;1680" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="120;320;120" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1100" cy="1100" r="300" fill="#b86bff" opacity="0.55">
        <animate attributeName="cx" values="1100;1500;1100" dur="19s" repeatCount="indefinite"/>
        <animate attributeName="r" values="300;400;300" dur="19s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="60" r="260" fill="#4fa3ff" opacity="0.45">
        <animate attributeName="cx" values="200;520;200" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;260;60" dur="21s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1920" height="1080" fill="#05060f" opacity="0.18"/>
    <text x="960" y="500" text-anchor="middle" class="title" fill="url(#ttl)" opacity="0">
      Developer Marketing Jobs
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="960" y="600" text-anchor="middle" class="sub" opacity="0">
      Your next dev marketing role
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1.2s" fill="freeze"/>
    </text>
    <text x="960" y="720" text-anchor="middle" class="role" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" keyTimes="0;0.02;0.1467;0.1667;1" values="1;1;1;0;0"/>Developer Advocate · DevRel</text>
    <text x="960" y="720" text-anchor="middle" class="role" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" keyTimes="0;0.1667;0.1867;0.3133;0.3333;1" values="0.00;0.00;1.00;1.00;0.00;0.00"/>Technical Writing · Docs</text>
    <text x="960" y="720" text-anchor="middle" class="role" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.3533;0.48;0.5;1" values="0.00;0.00;1.00;1.00;0.00;0.00"/>Developer Marketing</text>
    <text x="960" y="720" text-anchor="middle" class="role" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.6467;0.6667;1" values="0.00;0.00;1.00;1.00;0.00;0.00"/>Product Marketing</text>
    <text x="960" y="720" text-anchor="middle" class="role" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" keyTimes="0;0.6667;0.6867;0.8133;0.8333;1" values="0.00;0.00;1.00;1.00;0.00;0.00"/>Head of Growth · VP Marketing</text>
    <text x="960" y="720" text-anchor="middle" class="role" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" keyTimes="0;0.8333;0.8533;0.98;1.0" values="0.00;0.00;1.00;1.00;0.00"/>Community</text>
    <rect x="-500" y="1040" width="500" height="4" rx="2" fill="#ffffff" opacity="0.5">
      <animate attributeName="x" values="-500;1920" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
